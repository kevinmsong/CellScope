name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      # CPU-only: Cellpose and PyTorch are not installed; tests that need them skip.
      - name: Install
        run: python -m pip install -e . pytest ruff psutil
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q
      - name: Launcher
        run: python -m cellscope --version
